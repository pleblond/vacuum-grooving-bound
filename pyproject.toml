[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vacuum-creep-v31"
version = "3.1.0"
description = "Protocol v3.1: bound DC vacuum index creep from cryogenic Si cavity drift logs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
